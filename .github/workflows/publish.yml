name: Publish
# Publishes the package.json version to npm when it is not there yet. npm trusts this workflow
# (Trusted Publisher, OIDC): there is no token, and the release carries provenance.
# Manual only: merging to main does not publish. Run it with `gh workflow run publish.yml --ref main`.
on:
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # No dependency cache in the release job: everything it publishes is built from this checkout.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Decide whether this version is new
        id: decide
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "spec=$name@$version" >> "$GITHUB_OUTPUT"
          # stdout and stderr are kept apart: setup-node's always-auth warning goes to stderr
          # and must not spoil the version comparison.
          err_file="$RUNNER_TEMP/npm-view.err"
          set +e
          out=$(npm view "$name@$version" version 2>"$err_file")
          status=$?
          set -e
          if [ "$status" -eq 0 ] && [ "$out" = "$version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version 已在 npm 上，跳过发布。" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -ne 0 ] && grep -q 'E404' "$err_file"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # Only a definite "not found" counts as unpublished; any other registry answer stops here.
            cat "$err_file" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi
      - if: steps.decide.outputs.publish == 'true'
        run: npm test
      - if: steps.decide.outputs.publish == 'true'
        run: npm run check:coda
      - if: steps.decide.outputs.publish == 'true'
        run: git diff --exit-code
      # Trusted publishing needs npm 11.5.1 or later.
      - if: steps.decide.outputs.publish == 'true'
        name: Check npm supports trusted publishing
        run: |
          node --input-type=module -e "
            const [major, minor, patch] = '$(npm --version)'.split('.').map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error('npm ' + [major, minor, patch].join('.') + ' 不支持可信发布，需要 11.5.1 或更高');
              process.exit(1);
            }"
      - if: steps.decide.outputs.publish == 'true'
        run: npm publish --access public
      # npm can take about 10 minutes to show a release it has already accepted, so wait up to 15.
      # Each query and the whole step have a deadline. A timeout still fails the job (an unconfirmed release is not
      # reported as success), but the summary says the release was accepted so nobody publishes it again.
      # Nothing here retries the publish.
      - if: steps.decide.outputs.publish == 'true'
        name: Confirm the release
        timeout-minutes: 17
        env:
          SPEC: ${{ steps.decide.outputs.spec }}
        run: |
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            seen=$(timeout 30 npm view "$SPEC" version 2>/dev/null || true)
            if [ -n "$seen" ]; then
              echo "已发布 $SPEC。" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "发布已接受，公开确认超时，不要重发：$SPEC 的发布命令已成功，但 15 分钟内 registry 还读不到它。先到 npm 上查这个版本，不要重跑工作流。" >> "$GITHUB_STEP_SUMMARY"
          echo "发布命令成功，但 15 分钟内 registry 还读不到 $SPEC" >&2
          exit 1
